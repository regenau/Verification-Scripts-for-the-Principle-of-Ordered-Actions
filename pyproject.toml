[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gateway-number"
version = "1.1.0"
description = "Reference implementation of the catalysis Gateway number G and its verification report"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.17"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
gateway-number = "gateway_number:main"

[tool.setuptools]
py-modules = ["gateway_number"]
